services:
  # FastAPI ML Engine Service
  - type: web
    name: agrisense-ml-engine
    env: python
    buildCommand: "pip install -r ml/requirements.txt"
    startCommand: "uvicorn ml.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Django REST Backend API Service
  - type: web
    name: agrisense-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py migrate && python backend/manage.py seed_agrisense"
    startCommand: "gunicorn --chdir backend config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      # Production Managed DB (MySQL / Postgres) & Cloud Storage (S3 / Cloudinary)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: agrisense-db
      #     property: connectionString
      # - key: AWS_STORAGE_BUCKET_NAME
      #   value: "agrisense-media-storage"

  # React Vite Frontend Service
  - type: web
    name: agrisense-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
